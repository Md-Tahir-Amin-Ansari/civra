<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civra — Private Offline AI Chat</title>
    <style>
      /* CSS Custom Properties & Dynamic Themes */
      :root {
        --bg-app: #f3f4f6;
        --bg-sidebar: #ffffff;
        --bg-card: #ffffff;
        --bg-chat-user: #0284c7;
        --fg-chat-user: #ffffff;
        --bg-chat-ai: #f8fafc;
        --fg-chat-ai: #0f172a;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --danger: #dc2626;
        --danger-hover: #b91c1c;
        --warning-bg: #fef3c7;
        --warning-fg: #92400e;
        --accent-focus: #38bdf8;
        --font-main:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      }

      [data-theme="dark"] {
        --bg-app: #0f172a;
        --bg-sidebar: #1e293b;
        --bg-card: #1e293b;
        --bg-chat-user: #0284c7;
        --fg-chat-user: #ffffff;
        --bg-chat-ai: #334155;
        --fg-chat-ai: #f8fafc;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --primary: #38bdf8;
        --primary-hover: #0284c7;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --warning-bg: #451a03;
        --warning-fg: #fde68a;
        --accent-focus: #7dd3fc;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-main);
        background-color: var(--bg-app);
        color: var(--text-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }

      /* Accessibility & Focus Outline */
      :focus-visible {
        outline: 3px solid var(--accent-focus);
        outline-offset: 2px;
      }

      button,
      input,
      select {
        font-family: inherit;
        font-size: 0.95rem;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
      }

      /* Application Header Bar (Windows Desktop Frame Mock) */
      .app-header {
        height: 40px;
        background-color: var(--bg-sidebar);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        -webkit-app-region: drag;
      }

      .app-title {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .app-title-badge {
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--border-color);
        color: var(--text-main);
      }

      .app-controls {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .state-selector-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .state-selector {
        padding: 2px 8px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
        background: var(--bg-card);
        color: var(--text-main);
        font-size: 0.8rem;
      }

      /* App Main Layout Container */
      .app-container {
        flex: 1;
        display: flex;
        width: 100%;
        height: calc(100vh - 40px);
        max-width: 1600px;
        margin: 0 auto;
        overflow: hidden;
      }

      /* Sidebar Navigation & History */
      .sidebar {
        width: 280px;
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.2s ease;
      }

      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn-primary {
        background-color: var(--primary);
        color: #ffffff;
        padding: 10px 16px;
        border-radius: 6px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background-color 0.15s;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
      }

      .btn-secondary {
        background-color: transparent;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .btn-secondary:hover {
        background-color: var(--border-color);
      }

      .btn-danger {
        background-color: var(--danger);
        color: #ffffff;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 500;
      }

      .btn-danger:hover {
        background-color: var(--danger-hover);
      }

      .search-box {
        position: relative;
      }

      .search-input {
        width: 100%;
        padding: 8px 12px 8px 32px;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: var(--bg-app);
        color: var(--text-main);
        font-size: 0.85rem;
      }

      .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
      }

      .chat-history {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .chat-item {
        padding: 10px 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--text-main);
        text-decoration: none;
        font-size: 0.9rem;
        cursor: pointer;
        position: relative;
        border: 1px solid transparent;
      }

      .chat-item:hover {
        background-color: var(--bg-app);
      }

      .chat-item.active {
        background-color: var(--bg-app);
        border-color: var(--border-color);
        font-weight: 600;
      }

      .chat-item-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        margin-right: 8px;
      }

      .chat-item-actions {
        display: none;
        gap: 4px;
      }

      .chat-item:hover .chat-item-actions,
      .chat-item:focus-within .chat-item-actions {
        display: flex;
      }

      .icon-btn {
        padding: 4px;
        border-radius: 4px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-btn:hover {
        color: var(--text-main);
        background-color: var(--border-color);
      }

      .sidebar-footer {
        padding: 12px;
        border-top: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Main View Area */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-color: var(--bg-card);
        position: relative;
      }

      /* Status Banner / System Notices */
      .status-banner {
        padding: 10px 16px;
        background-color: var(--warning-bg);
        color: var(--warning-fg);
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border-color);
      }

      .status-banner.error {
        background-color: #fef2f2;
        color: #991b1b;
      }

      [data-theme="dark"] .status-banner.error {
        background-color: #450a0a;
        color: #fca5a5;
      }

      /* Message View / Chat Stream */
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .message-row {
        display: flex;
        flex-direction: column;
        max-width: 80%;
      }

      .message-row.user {
        align-self: flex-end;
      }

      .message-row.ai {
        align-self: flex-start;
      }

      .message-sender {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 4px;
        padding: 0 4px;
      }

      .message-bubble {
        padding: 14px 18px;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 0.95rem;
        position: relative;
        word-break: break-word;
      }

      .message-row.user .message-bubble {
        background-color: var(--bg-chat-user);
        color: var(--fg-chat-user);
        border-bottom-right-radius: 2px;
      }

      .message-row.ai .message-bubble {
        background-color: var(--bg-chat-ai);
        color: var(--fg-chat-ai);
        border-bottom-left-radius: 2px;
        border: 1px solid var(--border-color);
      }

      .message-actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        padding: 0 4px;
      }

      /* Chat Input Bar */
      .input-container {
        padding: 16px 24px;
        border-top: 1px solid var(--border-color);
        background-color: var(--bg-card);
      }

      .input-box-wrapper {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background-color: var(--bg-app);
        transition: border-color 0.2s;
      }

      .input-box-wrapper:focus-within {
        border-color: var(--primary);
      }

      .chat-textarea {
        width: 100%;
        border: none;
        background: transparent;
        padding: 12px 16px;
        color: var(--text-main);
        resize: none;
        height: 60px;
        outline: none;
        font-size: 0.95rem;
      }

      .input-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-top: 1px solid var(--border-color);
      }

      .disclaimer-text {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-align: center;
        margin-top: 8px;
      }

      /* Setup & Dialog Overlays */
      .overlay-screen {
        position: absolute;
        inset: 0;
        background-color: var(--bg-card);
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }

      .setup-card {
        max-width: 520px;
        width: 100%;
        display: flex;
        flex-direction: flex-start;
        flex-direction: column;
        gap: 20px;
        text-align: left;
      }

      .setup-header {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .setup-title {
        font-size: 1.6rem;
        font-weight: 700;
      }

      .notice-box {
        background-color: var(--bg-app);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .notice-item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background-color: var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 8px;
      }

      .progress-bar-fill {
        height: 100%;
        background-color: var(--primary);
        width: 0%;
        transition: width 0.3s ease;
      }

      /* Modal Component */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
      }

      .modal-dialog {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        width: 100%;
        max-width: 480px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .modal-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        padding: 20px 16px;
        font-size: 0.95rem;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .modal-footer {
        padding: 12px 16px;
        background-color: var(--bg-app);
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      /* Inline Collapsible Details Drawer */
      .details-drawer {
        font-family: monospace;
        font-size: 0.8rem;
        background: var(--bg-app);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 10px;
        margin-top: 8px;
        text-align: left;
        white-space: pre-wrap;
      }

      /* SVGs inline formatting */
      .svg-icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      /* Form Fields */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
      }

      .form-desc {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .toggle-control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
      }

      /* Utility Helpers */
      .hidden {
        display: none !important;
      }
      .flex-center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gap-8 {
        gap: 8px;
      }
    </style>
  </head>
  <body data-theme="light">
    <!-- Application Windows Frame Bar -->
    <header class="app-header">
      <div class="app-title">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        Civra — Private Offline AI Chat
        <span class="app-title-badge" id="offline-badge">Offline Ready</span>
      </div>
      <div class="app-controls">
        <div class="state-selector-wrap">
          <label for="state-sim">Interactive State Presets:</label>
          <select
            id="state-sim"
            class="state-selector"
            onchange="switchStatePreset(this.value)"
          >
            <option value="first-launch">
              1. First Launch (Setup Consent)
            </option>
            <option value="downloading">2. Download in Progress</option>
            <option value="download-fail">3. Download Failed</option>
            <option value="verifying">4. Verification in Progress</option>
            <option value="verify-fail">5. Verification Failed</option>
            <option value="ready-empty" selected>
              6. Offline Ready / New Chat
            </option>
            <option value="streaming">7. Active Streaming</option>

            <option value="stopped">8. Generation Stopped</option>
            <option value="gpu-fallback">9. GPU Unavailable (Fallback)</option>
          </select>
        </div>
        <button
          class="icon-btn"
          onclick="toggleTheme()"
          aria-label="Toggle Theme"
          title="Toggle Light/Dark Theme"
        >
          <svg class="svg-icon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Application Body Window -->
    <div class="app-container">
      <!-- Left Sidebar: History & Nav -->
      <aside class="sidebar" aria-label="Main Navigation">
        <div class="sidebar-header">
          <button class="btn-primary" onclick="startNewChat()">
            <svg class="svg-icon" viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            <span>New Chat</span>
          </button>
          <div class="search-box">
            <svg class="svg-icon search-icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search conversations..."
              oninput="filterHistory(this.value)"
              aria-label="Search local history"
            />
          </div>
        </div>

        <nav
          class="chat-history"
          id="chat-history-list"
          aria-label="Local Chat History"
        >
          <!-- History items dynamically inserted here -->
        </nav>

        <div class="sidebar-footer">
          <button
            class="btn-secondary"
            style="width: 100%; justify-content: flex-start"
            onclick="openSettingsModal()"
          >
            <svg class="svg-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            <span>Settings</span>
          </button>
          <button
            class="btn-secondary"
            style="
              width: 100%;
              justify-content: flex-start;
              color: var(--danger);
            "
            onclick="promptClearAllHistory()"
          >
            <svg class="svg-icon" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6" />
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              />
            </svg>
            <span>Clear All History</span>
          </button>
        </div>
      </aside>

      <!-- Right Content Area -->
      <main class="main-content">
        <!-- Dynamic Top Alert Banner for System Warnings / Fallbacks -->
        <div id="system-banner" class="status-banner hidden" role="status">
          <span id="banner-text">Notice message</span>
          <button
            class="btn-secondary"
            style="padding: 2px 8px; font-size: 0.75rem"
            onclick="toggleDetails('banner-details')"
          >
            <span>Details</span>
          </button>
        </div>
        <div
          id="banner-details"
          class="details-drawer hidden"
          style="margin: 0; border-radius: 0; border-x: 0"
        ></div>

        <!-- Messages View -->
        <div
          class="chat-messages"
          id="chat-messages"
          role="log"
          aria-live="polite"
        >
          <!-- Message bubbles populated by state / script -->
        </div>

        <!-- Chat Input Interface -->
        <div class="input-container" id="input-container">
          <div class="input-box-wrapper">
            <textarea
              id="message-input"
              class="chat-textarea"
              placeholder="Type a message... (Press Enter to send, Shift+Enter for new line)"
              aria-label="Chat message input"
              onkeydown="handleKeyDown(event)"
            ></textarea>
            <div class="input-actions">
              <span
                style="font-size: 0.8rem; color: var(--text-muted)"
                id="hardware-mode-indicator"
                >Mode: Standard (CPU)</span
              >
              <div style="display: flex; gap: 8px">
                <button
                  class="btn-secondary hidden"
                  id="stop-btn"
                  onclick="stopGeneration()"
                >
                  <svg class="svg-icon" viewBox="0 0 24 24">
                    <rect x="6" y="6" width="12" height="12" />
                  </svg>
                  <span>Stop</span>
                </button>
                <button
                  class="btn-primary"
                  id="send-btn"
                  onclick="sendMessage()"
                >
                  <span>Send</span>
                  <svg class="svg-icon" viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13" />
                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="disclaimer-text">
            Civra processes everything locally on your device. Outputs are
            AI-generated and can be inaccurate; always verify critical facts.
          </div>
        </div>

        <!-- SETUP / DOWNLOAD OVERLAY SCREEN -->
        <div id="setup-overlay" class="overlay-screen hidden">
          <div class="setup-card" id="setup-card-content">
            <!-- Setup state content generated dynamically -->
          </div>
        </div>
      </main>
    </div>

    <!-- MODALS CONTAINER -->
    <div
      id="modal-container"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal-dialog">
        <div class="modal-header">
          <span id="modal-title">Modal Title</span>
          <button
            class="icon-btn"
            onclick="closeModal()"
            aria-label="Close modal"
          >
            <svg class="svg-icon" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Dynamic modal body -->
        </div>
        <div class="modal-footer" id="modal-footer">
          <!-- Dynamic modal buttons -->
        </div>
      </div>
    </div>

    <!-- Application Logic & State Controller -->
    <script>
      // --- Application State ---
      const appState = {
        theme: "light",
        gpuEnabled: false,
        conversations: [
          {
            id: "1",
            title: "Welcome & System Overview",
            messages: [
              {
                sender: "user",
                text: "How does Civra keep my conversations private?",
              },
              {
                sender: "ai",
                text: "Civra runs entirely on your local computer hardware. Once the approved model file is downloaded during initial setup, no text, logs, or prompt data are ever transmitted to external servers or cloud services. Note: Local processing provides data isolation on your device, but does not substitute for operating system security.",
              },
            ],
          },
          {
            id: "2",
            title: "Drafting Offline Notes",
            messages: [
              {
                sender: "user",
                text: "Help me draft a outline for a local privacy policy.",
              },
              {
                sender: "ai",
                text: "Here is a foundational outline for a local data privacy guide:\n1. Scope & Storage\n2. Local File Encryption\n3. Hardware Execution Limits",
              },
            ],
          },
        ],
        activeChatId: "1",
        currentPreset: "ready-empty",
        isGenerating: false,
        downloadProgress: 0,
      };

      // Technical details string mock for explicit Details view
      const techDetailsString = `Model Specs:\n- Internal Identity: Standard Local Model\n- Quantization: 4-bit block execution\n- Storage Size: ~2.4 GB\n- Format / Runtime: .litertlm / Windows Local Execution Engine\n- Engine Context Window: 4096 context units`;

      // --- Core Functions ---

      function init() {
        renderHistory();
        switchStatePreset("ready-empty");
      }

      function toggleTheme() {
        appState.theme = appState.theme === "light" ? "dark" : "light";
        document.body.setAttribute("data-theme", appState.theme);
      }

      function toggleDetails(elementId) {
        const el = document.getElementById(elementId);
        if (el) {
          el.classList.toggle("hidden");
        }
      }

      function switchStatePreset(preset) {
        appState.currentPreset = preset;
        const setupOverlay = document.getElementById("setup-overlay");
        const setupCard = document.getElementById("setup-card-content");
        const banner = document.getElementById("system-banner");
        const bannerText = document.getElementById("banner-text");
        const bannerDetails = document.getElementById("banner-details");
        const messagesContainer = document.getElementById("chat-messages");
        const stopBtn = document.getElementById("stop-btn");
        const sendBtn = document.getElementById("send-btn");
        const offlineBadge = document.getElementById("offline-badge");

        // Reset Visibility Defaults
        setupOverlay.classList.add("hidden");
        banner.classList.add("hidden");
        bannerDetails.classList.add("hidden");
        stopBtn.classList.add("hidden");
        sendBtn.classList.remove("hidden");
        offlineBadge.textContent = "Offline Ready";
        offlineBadge.style.background = "var(--border-color)";

        switch (preset) {
          case "first-launch":
            offlineBadge.textContent = "Setup Required";
            setupOverlay.classList.remove("hidden");
            setupCard.innerHTML = `
            <div class="setup-header">
              <h1 class="setup-title">Welcome to Civra</h1>
              <p style="color: var(--text-muted);">Private, offline AI assistant on your Windows PC.</p>
            </div>
            <div class="notice-box">
              <div class="notice-item">
                <svg class="svg-icon" style="color: var(--primary);" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <div>
                  <strong>One-Time Internet Download</strong>
                  <p>Civra requires a single initial download of the approved AI model (approx. <strong>2.4 GB</strong> of storage required). Internet access is required only for this setup step.</p>
                </div>
              </div>
              <div class="notice-item">
                <svg class="svg-icon" style="color: var(--primary);" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <div>
                  <strong>100% Local & Private Processing</strong>
                  <p>Once setup is complete, normal chat operates entirely offline without network access. No accounts, cloud tracking, or external servers are used.</p>
                </div>
              </div>
              <div class="notice-item">
                <svg class="svg-icon" style="color: var(--text-muted);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <div>
                  <strong>Model Accuracy Notice</strong>
                  <p>Model outputs are generated locally and can contain errors or inaccuracies. Do not rely on outputs for critical medical, legal, or financial decisions.</p>
                </div>
              </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
              <button class="btn-secondary" onclick="toggleDetails('setup-details-1')">
                <span>Details</span>
              </button>
              <button class="btn-primary" onclick="switchStatePreset('downloading')">
                <span>Download & Begin Setup (2.4 GB)</span>
              </button>
            </div>
            <div id="setup-details-1" class="details-drawer hidden">${techDetailsString}</div>
          `;
            break;

          case "downloading":
            offlineBadge.textContent = "Downloading...";
            setupOverlay.classList.remove("hidden");
            setupCard.innerHTML = `
            <div class="setup-header">
              <h1 class="setup-title">Downloading AI Model</h1>
              <p style="color: var(--text-muted);">Please keep your internet connection active during this process.</p>
            </div>
            <div class="notice-box">
              <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <span>Downloading core model file...</span>
                <span>1.12 GB / 2.40 GB (46%)</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 46%;"></div>
              </div>
              <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Speed: ~12.5 MB/s &bull; Estimated time remaining: 1 min 42 sec</p>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <button class="btn-secondary" onclick="toggleDetails('setup-details-dl')">
                <span>Details</span>
              </button>
            </div>
            <div id="setup-details-dl" class="details-drawer hidden">URL: Approved Local Resource Storage\nTarget Folder: %LOCALAPPDATA%\\Civra\\Models\\\nHash Verification: Pending Download Completion</div>
          `;
            break;

          case "download-fail":
            offlineBadge.textContent = "Download Error";
            setupOverlay.classList.remove("hidden");
            setupCard.innerHTML = `
            <div class="setup-header">
              <h1 class="setup-title">Download Interrupted</h1>
              <p style="color: #dc2626;">Unable to complete model download.</p>
            </div>
            <div class="notice-box" style="border-color: #fca5a5;">
              <p><strong>What happened:</strong> The network connection was lost or interrupted before finishing the 2.4 GB file.</p>
              <p><strong>What to do next:</strong> Check your internet connection and select "Retry Download". Progress will resume from where it left off.</p>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <button class="btn-secondary" onclick="toggleDetails('setup-details-fail')">
                <span>Details</span>
              </button>
              <button class="btn-primary" onclick="switchStatePreset('downloading')">
                <span>Retry Download</span>
              </button>
            </div>
            <div id="setup-details-fail" class="details-drawer hidden">Error Code: NET_TIMEOUT_ERR_08\nByte Offset Saved: 1,204,228,100 bytes\nNetwork Interface: Disconnected / Retrying socket binding</div>
          `;
            break;

          case "verifying":
            offlineBadge.textContent = "Verifying...";
            setupOverlay.classList.remove("hidden");
            setupCard.innerHTML = `
            <div class="setup-header">
              <h1 class="setup-title">Verifying Model Integrity</h1>
              <p style="color: var(--text-muted);">Checking file security and integrity before first use.</p>
            </div>
            <div class="notice-box">
              <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                <span>Checking checksum signature...</span>
                <span>Calculating...</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: 78%;"></div>
              </div>
            </div>
          `;
            break;

          case "verify-fail":
            offlineBadge.textContent = "Verification Failed";
            setupOverlay.classList.remove("hidden");
            setupCard.innerHTML = `
            <div class="setup-header">
              <h1 class="setup-title">Model Verification Failed</h1>
              <p style="color: #dc2626;">The downloaded file appears corrupted or incomplete.</p>
            </div>
            <div class="notice-box">
              <p><strong>What happened:</strong> Local security verification detected a cryptographic checksum mismatch in the downloaded model file.</p>
              <p><strong>What to do next:</strong> Redownload the file to ensure local processing is safe and correct.</p>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <button class="btn-secondary" onclick="toggleDetails('setup-details-vf')">
                <span>Details</span>
              </button>
              <button class="btn-primary" onclick="switchStatePreset('downloading')">
                <span>Redownload Model (2.4 GB)</span>
              </button>
            </div>
            <div id="setup-details-vf" class="details-drawer hidden">Expected SHA256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855\nActual SHA256:   9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08</div>
          `;
            break;

          case "ready-empty":
            renderChatMessages([]);
            break;

          case "streaming":
            renderChatMessages([
              {
                sender: "user",
                text: "Can you summarize how local AI works without cloud servers?",
              },
              {
                sender: "ai",
                text: "Local AI executes model mathematical computations directly on your computer’s local processor (CPU) or graphics accelerator (GPU). Instead of streaming text inputs across internet cables to distant servers, the entire neural network weight matrix is loaded into your local RAM...",
                streaming: true,
              },
            ]);
            sendBtn.classList.add("hidden");
            stopBtn.classList.remove("hidden");
            break;

          case "stopped":
            renderChatMessages([
              {
                sender: "user",
                text: "Can you summarize how local AI works without cloud servers?",
              },
              {
                sender: "ai",
                text: "Local AI executes model mathematical computations directly on your computer’s local processor (CPU) or graphics accelerator (GPU)... [Generation stopped by user]",
                stopped: true,
              },
            ]);
            break;

          case "gpu-fallback":
            banner.classList.remove("hidden");
            bannerText.textContent =
              "GPU initialization failed. Civra automatically switched to the reliable CPU mode.";
            bannerDetails.textContent =
              "Error: GPU VRAM Allocation Failure (0x887A0005). Requested: 3.1 GB, Available: 1.2 GB. Fallback Target: CPU Execution Engine.";
            renderChatMessages(appState.conversations[0].messages);
            break;
        }
      }

      function renderHistory(filter = "") {
        const historyNav = document.getElementById("chat-history-list");
        historyNav.innerHTML = "";

        const filtered = appState.conversations.filter((c) =>
          c.title.toLowerCase().includes(filter.toLowerCase()),
        );

        if (filtered.length === 0) {
          historyNav.innerHTML = `<div style="padding: 12px; font-size: 0.85rem; color: var(--text-muted); text-align: center;">No conversations found</div>`;
          return;
        }

        filtered.forEach((chat) => {
          const item = document.createElement("div");
          item.className = `chat-item ${chat.id === appState.activeChatId ? "active" : ""}`;
          item.tabIndex = 0;
          item.onclick = () => selectChat(chat.id);
          item.onkeydown = (e) => {
            if (e.key === "Enter") selectChat(chat.id);
          };

          item.innerHTML = `
          <span class="chat-item-title" title="${escapeHtml(chat.title)}">${escapeHtml(chat.title)}</span>
          <div class="chat-item-actions">
            <button class="icon-btn" onclick="event.stopPropagation(); renameChatPrompt('${chat.id}')" title="Rename" aria-label="Rename Chat">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            </button>
            <button class="icon-btn" onclick="event.stopPropagation(); deleteChatPrompt('${chat.id}')" title="Delete" aria-label="Delete Chat">
              <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            </button>
          </div>
        `;
          historyNav.appendChild(item);
        });
      }

      function renderChatMessages(messages) {
        const container = document.getElementById("chat-messages");
        container.innerHTML = "";

        if (!messages || messages.length === 0) {
          container.innerHTML = `
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); gap: 12px;">
            <svg class="svg-icon" style="width: 48px; height: 48px; stroke-width: 1.5; color: var(--primary);" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p style="font-size: 1.1rem; font-weight: 600; color: var(--text-main);">Offline Chat Ready</p>
            <p style="max-width: 360px; font-size: 0.85rem;">Send a message to start conversing with your local model. No data leaves this device.</p>
          </div>
        `;
          return;
        }

        messages.forEach((msg, idx) => {
          const row = document.createElement("div");
          row.className = `message-row ${msg.sender}`;

          const isLast = idx === messages.length - 1;
          const senderLabel =
            msg.sender === "user" ? "You" : "Civra (Offline Model)";

          let actionsHtml = "";
          if (msg.sender === "ai") {
            actionsHtml = `
            <div class="message-actions">
              <button class="btn-secondary" style="padding: 2px 8px; font-size: 0.75rem;" onclick="copyToClipboard('${escapeJsString(msg.text)}')">
                <svg class="svg-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span>Copy</span>
              </button>
              ${
                isLast
                  ? `
                <button class="btn-secondary" style="padding: 2px 8px; font-size: 0.75rem;" onclick="retryLastMessage()">
                  <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                  <span>Retry</span>
                </button>
              `
                  : ""
              }
            </div>
          `;
          }

          row.innerHTML = `
          <div class="message-sender">${senderLabel}</div>
          <div class="message-bubble">
            ${escapeHtml(msg.text).replace(/\n/g, "<br>")}
            ${msg.streaming ? ' <span style="animation: blink 1s infinite;">&#9613;</span>' : ""}
          </div>
          ${actionsHtml}
        `;
          container.appendChild(row);
        });

        container.scrollTop = container.scrollHeight;
      }

      function selectChat(id) {
        appState.activeChatId = id;
        const chat = appState.conversations.find((c) => c.id === id);
        renderHistory(document.getElementById("search-input").value);
        if (chat) {
          renderChatMessages(chat.messages);
        }
      }

      function startNewChat() {
        const newId = Date.now().toString();
        const newChat = {
          id: newId,
          title: "New Conversation",
          messages: [],
        };
        appState.conversations.unshift(newChat);
        appState.activeChatId = newId;
        renderHistory();
        renderChatMessages([]);
      }

      function sendMessage() {
        const input = document.getElementById("message-input");
        const text = input.value.trim();
        if (!text) return;

        let chat = appState.conversations.find(
          (c) => c.id === appState.activeChatId,
        );
        if (!chat) {
          startNewChat();
          chat = appState.conversations.find(
            (c) => c.id === appState.activeChatId,
          );
        }

        if (chat.messages.length === 0) {
          chat.title = text.slice(0, 28) + (text.length > 28 ? "..." : "");
          renderHistory();
        }

        chat.messages.push({ sender: "user", text });
        input.value = "";
        renderChatMessages(chat.messages);

        // Simulate AI response response state streaming switch
        setTimeout(() => {
          switchStatePreset("streaming");
        }, 400);
      }

      function stopGeneration() {
        switchStatePreset("stopped");
      }

      function retryLastMessage() {
        switchStatePreset("streaming");
      }

      function filterHistory(text) {
        renderHistory(text);
      }

      function handleKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      // --- Modal Management ---

      function openModal(title, bodyHtml, footerButtonsHtml) {
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-body").innerHTML = bodyHtml;
        document.getElementById("modal-footer").innerHTML = footerButtonsHtml;
        document.getElementById("modal-container").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("modal-container").classList.add("hidden");
      }

      function renameChatPrompt(id) {
        const chat = appState.conversations.find((c) => c.id === id);
        if (!chat) return;

        const body = `
        <div class="form-group">
          <label class="form-label" for="rename-input">Conversation Title</label>
          <input type="text" id="rename-input" class="search-input" value="${escapeHtml(chat.title)}">
        </div>
      `;
        const footer = `
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-primary" onclick="confirmRename('${id}')">Save</button>
      `;
        openModal("Rename Conversation", body, footer);
      }

      function confirmRename(id) {
        const val = document.getElementById("rename-input").value.trim();
        if (val) {
          const chat = appState.conversations.find((c) => c.id === id);
          if (chat) chat.title = val;
          renderHistory();
        }
        closeModal();
      }

      function deleteChatPrompt(id) {
        const body = `<p>Are you sure you want to delete this conversation? This action cannot be undone.</p>`;
        const footer = `
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete('${id}')">Delete</button>
      `;
        openModal("Delete Conversation", body, footer);
      }

      function confirmDelete(id) {
        appState.conversations = appState.conversations.filter(
          (c) => c.id !== id,
        );
        if (appState.activeChatId === id) {
          appState.activeChatId =
            appState.conversations.length > 0
              ? appState.conversations[0].id
              : null;
        }
        renderHistory();
        if (appState.activeChatId) {
          selectChat(appState.activeChatId);
        } else {
          renderChatMessages([]);
        }
        closeModal();
      }

      function promptClearAllHistory() {
        const body = `
        <p style="color: var(--danger); font-weight: 600;">Warning: Permanently Delete All Local History?</p>
        <p>This will erase all local message logs stored on this device. This process cannot be reversed.</p>
      `;
        const footer = `
        <button class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn-danger" onclick="confirmClearAll()">Clear All History</button>
      `;
        openModal("Clear All History", body, footer);
      }

      function confirmClearAll() {
        appState.conversations = [];
        appState.activeChatId = null;
        renderHistory();
        renderChatMessages([]);
        closeModal();
      }

      function openSettingsModal() {
        const body = `
        <div class="form-group">
          <div class="toggle-control">
            <div>
              <div class="form-label">Experimental GPU Mode</div>
              <div class="form-desc">Attempt hardware acceleration for faster model generation.</div>
            </div>
            <input type="checkbox" id="gpu-toggle" ${appState.gpuEnabled ? "checked" : ""} onchange="toggleGpuSetting(this.checked)" style="width: 20px; height: 20px; cursor: pointer;">
          </div>
        </div>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 8px 0;">
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="form-label">Model Technical Information</span>
            <button class="btn-secondary" style="padding: 2px 8px; font-size: 0.75rem;" onclick="toggleDetails('settings-details')">Details</button>
          </div>
          <div id="settings-details" class="details-drawer hidden">${techDetailsString}</div>
        </div>
      `;
        const footer = `<button class="btn-primary" onclick="closeModal()">Close</button>`;
        openModal("Settings", body, footer);
      }

      function toggleGpuSetting(enabled) {
        appState.gpuEnabled = enabled;
        const indicator = document.getElementById("hardware-mode-indicator");
        if (enabled) {
          indicator.textContent = "Mode: Experimental (GPU)";
          // Simulate fallback requirement preview
          switchStatePreset("gpu-fallback");
        } else {
          indicator.textContent = "Mode: Standard (CPU)";
          document.getElementById("system-banner").classList.add("hidden");
        }
      }

      function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        // Brief toast or feedback can be added here
      }

      // Helper Escapes
      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function escapeJsString(str) {
        return str
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'")
          .replace(/\n/g, "\\n");
      }

      // Run Initial Setup
      window.onload = init;
    </script>
  </body>
</html>
